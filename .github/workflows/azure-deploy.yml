name: Deploy DataBurn to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Login no Azure via OIDC
      uses: azure/login@v2
      with:
        client-id: "183499d5-cb81-4c2a-8abf-cedf77d8ea70"
        tenant-id: "11dbbfe2-89b8-4549-be10-cec364e59551"
        subscription-id: "0a6337c5-7ac8-46e7-9b15-00b8fb6c51da"

    - name: Simular Build do Projeto
      run: |
        echo "Iniciando compilação dos módulos fictícios..."
        mkdir -p build_output
        echo "<h1>DataBurn Dashboard</h1>" > build_output/index.html
        cd build_output && zip -r ../deploy.zip .
        echo "Pacote pronto para envio!"

    - name: Deploy Simulado via Azure CLI
      run: |
        az webapp deployment source config-zip --name "databurn" --resource-group "databurn_group" --src ./deploy.zip
        echo "Deploy concluído com sucesso no ecossistema Azure!"
