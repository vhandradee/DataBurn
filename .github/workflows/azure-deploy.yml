name: Deploy DataBurn to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Login no Azure via OIDC
      uses: azure/login@v2
      with:
        client-id: "183499d5-cb81-4c2a-8abf-cedf77d8ea70"
        tenant-id: "11dbbfe2-89b8-4549-be10-cec364e59551"
        subscription-id: "0a6337c5-7ac8-46e7-9b15-00b8fb6c51da"

    - name: Deploy para o Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: "databurn"
